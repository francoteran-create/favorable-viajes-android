name: Build Nautilus Presentismo APK
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-nautilus:
    if: github.head_ref == 'nautilus-presentismo' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Nautilus source
        run: |
          cat nautilus_source/chunk_* > nautilus_source/source.b64
          base64 -d nautilus_source/source.b64 > /tmp/nautilus.zip
          mkdir -p /tmp/nautilus
          unzip -q /tmp/nautilus.zip -d /tmp/nautilus
          echo "PROJECT=$(find /tmp/nautilus -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"
      - name: Complete diagnostic punch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ["PROJECT"])/"app/src/main/java/ar/com/nautiluscountry/presentismo/MainActivity.java"
          s=p.read_text()
          helper="""
           ArrayList<Date> punchesForWorkday(String pid,String day,String st,String et){
            ArrayList<Date> out=new ArrayList<>();
            try{
             SimpleDateFormat df=new SimpleDateFormat("yyyy-MM-dd HH:mm",Locale.US);
             Date a=df.parse(day+" "+st),b=df.parse(day+" "+et);
             if(!b.after(a))b=new Date(b.getTime()+86400000L);
             SimpleDateFormat iso=new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss",Locale.US);
             String from=iso.format(new Date(a.getTime()-14400000L));
             String to=iso.format(new Date(b.getTime()+14400000L));
             Cursor c=db.getReadableDatabase().rawQuery("SELECT stamp FROM punches WHERE person_id=? AND stamp>=? AND stamp<=? ORDER BY stamp",new String[]{pid,from,to});
             while(c.moveToNext()){try{out.add(iso.parse(c.getString(0).substring(0,19)));}catch(Exception ignored){}}
             c.close();
            }catch(Exception ignored){}
            return out;
           }
          """
          assert " static class DayResult{" in s
          p.write_text(s.replace(" static class DayResult{",helper+"\n static class DayResult{"))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build debug APK
        run: cd "$PROJECT" && gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mkdir -p out
          cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" out/Nautilus-Presentismo-V6.0-PRUEBA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NAUTILUS-PRESENTISMO-APK
          path: out/Nautilus-Presentismo-V6.0-PRUEBA.apk
