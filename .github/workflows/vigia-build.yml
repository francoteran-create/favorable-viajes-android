name: VIGIA Android APK
on:
  workflow_dispatch:
  push:
    branches: [vigia-android]
    paths:
      - 'vigia/**'
      - '.github/workflows/vigia-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        run: gradle -p vigia --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle -p vigia --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VIGIA-debug
          path: vigia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
