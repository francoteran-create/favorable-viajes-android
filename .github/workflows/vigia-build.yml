name: VIGIA Android APK
on:
  workflow_dispatch:
  push:
    branches: [vigia-android]
    paths: ['vigia/**', '.github/workflows/vigia-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p vigia --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VIGIA-debug
          path: vigia/app/build/outputs/apk/debug/*.apk
